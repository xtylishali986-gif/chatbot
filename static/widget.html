<!-- static/widget.html -->
<!-- WHAT: Self-contained chat widget — loads inside an iframe on a CLIENT's
     website. Plain HTML/CSS/JS, zero build step, zero framework dependency,
     so it loads instantly regardless of what the host site uses. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Store Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: #f9fafb;
  }
  #header {
    background: #2563eb;
    color: white;
    padding: 14px 16px;
    font-weight: 600;
    font-size: 15px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: #2563eb;
    color: white;
  }
  .msg.bot {
    align-self: flex-start;
    background: white;
    border: 1px solid #e5e7eb;
    color: #1f2937;
  }
  .msg.typing {
    align-self: flex-start;
    background: white;
    border: 1px solid #e5e7eb;
    color: #9ca3af;
    font-style: italic;
  }
  #input-area {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #e5e7eb;
    background: white;
  }
  #input-box {
    flex: 1;
    border: 1px solid #d1d5db;
    border-radius: 20px;
    padding: 10px 14px;
    font-size: 14px;
    outline: none;
  }
  #input-box:focus { border-color: #2563eb; }
  #send-btn {
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<div id="header">Store Assistant</div>
<div id="messages"></div>
<div id="input-area">
  <input id="input-box" type="text" placeholder="Ask a question..." />
  <button id="send-btn">Send</button>
</div>

<script>
  // WHY: Empty string = "same origin" — since widget.html is served from
  // the SAME Railway app that runs /chat, we don't need to hardcode any
  // domain at all. This also means it automatically works correctly
  // whether you're testing locally or running live on Railway, with zero
  // code changes needed between environments.
  const API_URL = "";

  const urlParams = new URLSearchParams(window.location.search);
  const brandColor = urlParams.get("color") || "#2563eb";
  const storeName = urlParams.get("storeName") || "Store Assistant";
  // WHY (Phase 8 integration): read the api_key passed by embed.js via URL
  // params — this is what tells the backend WHICH client this conversation
  // belongs to, so it returns that client's products/policies/orders only.
  const apiKey = urlParams.get("apiKey") || "";

  document.getElementById("header").textContent = storeName;
  document.getElementById("header").style.background = brandColor;
  document.getElementById("send-btn").style.background = brandColor;
  document.documentElement.style.setProperty("--brand-color", brandColor);

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input-box");
  const sendBtn = document.getElementById("send-btn");

  let sessionId = localStorage.getItem("chat_session_id");

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    if (role === "user") div.style.background = brandColor;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage("user", text);
    inputEl.value = "";
    sendBtn.disabled = true;

    const typingEl = addMessage("typing", "Typing...");

    try {
      const response = await fetch(API_URL + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        // WHY: api_key is now included on every request — required since
        // Phase 8 made this a mandatory field for identifying the client.
        body: JSON.stringify({ api_key: apiKey, session_id: sessionId, message: text }),
      });

      if (response.status === 401) {
        typingEl.remove();
        addMessage("bot", "This chat widget isn't configured correctly. Please contact the site owner.");
        return;
      }

      if (response.status === 503) {
        const data = await response.json();
        typingEl.remove();
        addMessage("bot", data.detail || "High demand right now, please try again shortly.");
        return;
      }

      if (!response.ok) throw new Error("Server error");

      const data = await response.json();

      if (data.session_id !== sessionId) {
        sessionId = data.session_id;
        localStorage.setItem("chat_session_id", sessionId);
      }

      typingEl.remove();
      addMessage("bot", data.reply);
    } catch (err) {
      typingEl.remove();
      addMessage("bot", "⚠️ Something went wrong. Please try again.");
      console.error(err);
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  addMessage("bot", "Hi! How can I help you today?");
</script>

</body>
</html>
